name: Question / Help
description: Ask about configuring or using ZeroPress Static.
body:
  - type: markdown
    attributes:
      value: |
        Issues are public; remove passwords, tokens and personal data.
        For security vulnerabilities, use [private vulnerability reporting](https://github.com/zeropress-app/zeropress-static/security/advisories/new).
  - type: textarea
    id: question
    attributes:
      label: How can we help?
      description: Describe what you are trying to do and where you need help.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include what you have tried, relevant versions or screenshots if helpful.
